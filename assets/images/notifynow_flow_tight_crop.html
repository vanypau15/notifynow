
<style>
  @keyframes dash { to { stroke-dashoffset: -22; } }
  @keyframes pulse { 0%,100%{opacity:0.10} 50%{opacity:0.20} }
  .flow  { stroke-dasharray: 6 6; animation: dash 1.6s linear infinite; }
  .flow-2{ stroke-dasharray: 6 6; animation: dash 1.6s linear infinite; animation-delay:.27s; }
  .flow-3{ stroke-dasharray: 6 6; animation: dash 1.6s linear infinite; animation-delay:.53s; }
  .flow-4{ stroke-dasharray: 6 6; animation: dash 1.6s linear infinite; animation-delay:.80s; }
  .flow-5{ stroke-dasharray: 6 6; animation: dash 1.6s linear infinite; animation-delay:1.07s; }
  .flow-6{ stroke-dasharray: 6 6; animation: dash 1.6s linear infinite; animation-delay:1.33s; }
  .ring  { animation: pulse 3s ease-in-out infinite; }
  .ring2 { animation: pulse 3s ease-in-out infinite; animation-delay:.9s; }
  @media (prefers-reduced-motion: reduce) {
    .flow,.flow-2,.flow-3,.flow-4,.flow-5,.flow-6{ animation:none; stroke-dasharray:none; }
    .ring,.ring2{ animation:none; }
  }
</style>
